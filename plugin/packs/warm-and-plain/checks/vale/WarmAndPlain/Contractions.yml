extends: substitution
message: "Consider '%s' instead of '%s'."
level: suggestion
ignorecase: true
swap:
  do not: don't
  does not: doesn't
  did not: didn't
  cannot: can't
  can not: can't
  is not: isn't
  are not: aren't
  will not: won't
  it is: it's
  you will: you'll
  we will: we'll
  you are: you're
  we are: we're
