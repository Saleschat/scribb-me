# Example BASE: rules for every piece, whatever the content type or style.
# Only universal habits go here (anti-AI-writing tells); they never relax.
id: base
kind: base
version: 0.2.0
tagline: Universal rules against AI writing habits. Always on.
license: MIT
traits:
  medium: [docs, ui, marketing, editorial, social, email]
sources:
  - name: blader/humanizer
    url: https://github.com/blader/humanizer
    license: MIT
    use: inspiration
  - name: "Wikipedia: Signs of AI writing"
    url: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
    license: CC-BY-SA-4.0
    use: inspiration only; no text is quoted
  - name: 'Stephanie Zinn, "Habits of AI writing, and what to do about them", a16z crypto (Aug 2026)'
    url: https://a16zcrypto.com/posts/article/ai-writing-hallmarks-for-founders/
    license: all rights reserved
    use: inspiration only; reworded, never quoted
  - name: sam-paech/slop-score
    url: https://github.com/sam-paech/slop-score
    license: MIT
    use: inspiration for the "not X, but Y" patterns
  - name: 'George Orwell, "Politics and the English Language" (1946)'
    url: https://www.orwellfoundation.com/the-orwell-foundation/orwell/essays-and-other-works/politics-and-the-english-language/
    license: public domain in some countries; all rights reserved in others
    use: inspiration only; the "Before you send it" questions are our own words, never quoted
  - name: William Strunk Jr., The Elements of Style (1918 edition)
    url: https://www.gutenberg.org/ebooks/37134
    license: public domain (1918 edition)
    use: inspiration for NeedlessWords ("omit needless words"); our own words
tags: [anti-ai]
